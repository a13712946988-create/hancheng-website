backend:
  name: git-gateway
  branch: main # GitHub 默认主分支

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "products"
    label: "产品管理"
    folder: "content/products"
    create: true
    fields:
      - {label: "产品名称", name: "title", widget: "string"}
      - {label: "产品分类", name: "category", widget: "select", options: ["蜂窝纸系列", "薄纸系列", "缓冲系列", "其他环保品"]}
      - {label: "主图", name: "image", widget: "image"}
      - {label: "详情描述", name: "body", widget: "markdown"}

  - name: "blog"
    label: "行业洞察 (SEO)"
    folder: "content/blog"
    create: true
    fields:
      - {label: "文章标题", name: "title", widget: "string"}
      - {label: "发布日期", name: "date", widget: "datetime"}
      - {label: "封面图", name: "thumbnail", widget: "image"}
      - {label: "正文内容", name: "body", widget: "markdown"}
